apiVersion: apps/v1
kind: Deployment
metadata:
  name: afoc-services
  namespace: afoc
  labels:
    app: afoc-services
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: afoc-services
  template:
    metadata:
      labels:
        app: afoc-services
        component: backend
    spec:
      containers:
      - name: services
        image: afoc-services:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
