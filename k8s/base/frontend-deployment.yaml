apiVersion: apps/v1
kind: Deployment
metadata:
  name: afoc-frontend
  namespace: afoc
  labels:
    app: afoc-frontend
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: afoc-frontend
  template:
    metadata:
      labels:
        app: afoc-frontend
        component: frontend
    spec:
      containers:
      - name: frontend
        image: afoc-frontend:latest
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
