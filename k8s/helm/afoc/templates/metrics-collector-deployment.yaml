{{- if .Values.metricsCollector.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "afoc.fullname" . }}-metrics-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "afoc.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics-collector
spec:
  {{- if not .Values.metricsCollector.autoscaling.enabled }}
  replicas: {{ .Values.metricsCollector.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "afoc.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics-collector
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "afoc.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: metrics-collector
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "afoc.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: metrics-collector
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.metricsCollector.image.repository }}:{{ .Values.metricsCollector.image.tag }}"
        imagePullPolicy: {{ .Values.metricsCollector.image.pullPolicy }}
        ports:
        - name: grpc
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        {{- range $key, $value := .Values.metricsCollector.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          {{- toYaml .Values.metricsCollector.resources | nindent 12 }}
        livenessProbe:
          grpc:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          grpc:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "afoc.fullname" . }}-metrics-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "afoc.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics-collector
spec:
  type: {{ .Values.metricsCollector.service.type }}
  ports:
  - port: {{ .Values.metricsCollector.service.port }}
    targetPort: grpc
    protocol: TCP
    name: grpc
  - port: 9090
    targetPort: metrics
    protocol: TCP
    name: metrics
  selector:
    {{- include "afoc.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: metrics-collector
{{- if .Values.metricsCollector.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "afoc.fullname" . }}-metrics-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "afoc.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "afoc.fullname" . }}-metrics-collector
  minReplicas: {{ .Values.metricsCollector.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.metricsCollector.autoscaling.maxReplicas }}
  metrics:
  {{- if .Values.metricsCollector.autoscaling.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.metricsCollector.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
  {{- if .Values.metricsCollector.autoscaling.targetMemoryUtilizationPercentage }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{ .Values.metricsCollector.autoscaling.targetMemoryUtilizationPercentage }}
  {{- end }}
{{- end }}
{{- end }}
