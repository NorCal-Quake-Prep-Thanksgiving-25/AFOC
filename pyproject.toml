[project]
name = "afoc"
version = "0.0.0"
description = "Autonomous Fiscal Orchestration Core"
requires-python = ">=3.12"

[project.optional-dependencies]
ml = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "mlflow>=2.12",
]
integrations = [
    "httpx>=0.27",
    "boto3>=1.34",
    "azure-identity>=1.17",
    "azure-mgmt-costmanagement>=3.0",
    "google-cloud-billing>=1.11",
]
data = [
    "sqlalchemy>=2.0",
    "redis>=5.0",
    "psycopg2-binary>=2.9",
]
observability = [
    "structlog>=24.1",
    "keyring>=25.3",
]
quantum = [
    "pennylane>=0.36",
    "qiskit>=1.0",
]

[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
allow_redefinition = true
follow_imports = "skip"
show_error_codes = true
warn_unused_configs = true
warn_unused_ignores = false
