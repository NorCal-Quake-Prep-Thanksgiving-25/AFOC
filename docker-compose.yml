version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: afoc
      POSTGRES_PASSWORD: afoc
      POSTGRES_DB: afoc
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afoc -d afoc"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: .
    command: uvicorn afoc.api.app:create_app --host 0.0.0.0 --port 8000 --factory
    environment:
      DATABASE_URL: postgres://afoc:afoc@db:5432/afoc
      API_TOKENS: dev-token
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'import urllib.request,sys; sys.exit(0) if urllib.request.urlopen(\"http://localhost:8000/health\").status==200 else sys.exit(1)'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
