version: 2
patterns:
  - name: "API Keys"
    id: eliteai-api-key
    pattern: "[A-Za-z0-9]{32}"
    severity: high
    description: Detects generic 32-character API keys.
  - name: "Private Algorithm Patterns"
    id: eliteai-private-algorithm
    pattern: "class.*(QuantumROI|AutonomousFiscal)"
    severity: critical
    description: Flags inadvertent exposure of proprietary algorithm identifiers.
alerts:
  email: your-security@company.com
  block_push: true
